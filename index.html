<!DOCTYPE html>
<html>
<head>
    <script>
        const url = new URLSearchParams(window.location.search).get('redirect');
        if (url) window.location.replace(url);
    </script>
</head>
<body>
    <a id="l" href="#">Redirecting...</a>
    <script>if(url) document.getElementById('l').href = url;</script>
</body>
